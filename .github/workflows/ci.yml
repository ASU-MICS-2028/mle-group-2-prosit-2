name: CI (Lint & Guardrail Tests)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint shared source and tests with ruff
        run: ruff check src/ tests/

      - name: Run ML leakage, pipeline, and scorer contract tests
        run: pytest tests/ -v
