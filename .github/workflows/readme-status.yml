name: README status

# Keeps the README's progress table, issue badge and per-person issue cards in step with GitHub.
# Runs when issues or pull requests change, when the card text or generator changes on main,
# every morning, and on demand (Actions tab -> README status -> Run workflow).
# It commits only when the status actually changed (the date alone never triggers a commit).

on:
  issues:
    types: [opened, edited, closed, reopened, assigned, unassigned, labeled, unlabeled]
  pull_request:
    types: [opened, edited, closed, reopened]
  push:
    branches: [main]
    paths: ["docs/issue_cards.yaml", "scripts/update_readme.py"]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: readme-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Rebuild README status from issues and pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.update_readme

      - name: Commit if the status changed
        run: |
          if git diff --quiet README.md; then
            echo "README status unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "README status: sync with issues and pull requests [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
