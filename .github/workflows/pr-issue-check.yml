name: PR Issue Link Check

# Ensures every PR into main links a real GitHub issue (e.g. "Closes #13" or "Refs #13")
# and did not leave the template placeholder "Closes #<issue>" unedited.
# Add label "no-issue-needed" to skip for trivial maintenance PRs.

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

jobs:
  check-issue-link:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR description references an issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if echo ",$LABELS," | grep -q ",no-issue-needed,"; then
            echo "Label no-issue-needed present: skipping."
            exit 0
          fi
          if echo "$PR_BODY" | grep -q "Closes #<issue>"; then
            echo "::error::Replace the template placeholder 'Closes #<issue>' with a real issue number (e.g. 'Closes #13' or 'Refs #13')."
            exit 1
          fi
          if ! echo "$PR_BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?)[[:space:]]+#[0-9]+'; then
            echo "::error::PR description must link an issue (e.g. 'Closes #13' or 'Refs #13') so GitHub auto-closes completed tasks."
            exit 1
          fi
          echo "Issue link verified."
